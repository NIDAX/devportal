apiVersion: apps/v1
kind: Deployment
metadata:
  name: devteam1
  namespace: devportal
  labels:
    team: devteam1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devteam1
  template:
    metadata:
      labels:
        app: devteam1
    spec:
      containers:
        - name: service
          image: nidarow/devportal-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: "loan-service"
            - name: TEAM_NAME
              value: "devteam1"
            - name: ENVIRONMENT
              value: "production"
            - name: SERVICE_VERSION
              value: "1.0.0"
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
